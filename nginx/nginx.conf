load_module modules/ngx_http_modsecurity_module.so;

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format waf_detailed '$remote_addr [$time_local] '
                             '"$request_method $request_uri $server_protocol" '
                             '$status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" '
                             'rt=$request_time';

    access_log /var/log/nginx/access.log waf_detailed;

    sendfile       on;
    tcp_nopush     on;
    keepalive_timeout 65;
    server_tokens  off;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=global:10m rate=200r/m;

    # Security headers global
    add_header X-Frame-Options           "SAMEORIGIN"    always;
    add_header X-Content-Type-Options    "nosniff"       always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ─── WAF SaaS Platform (Dashboard + API) ────────────────────────────────
    server {
        listen 80;
        server_name waf.local localhost _;

        # Dashboard UI (frontend)
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Backend API
        location /api/ {
            proxy_pass http://backend:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ─── Per-Site Configs (di-generate otomatis oleh backend) ───────────────
    # File *.conf per domain didrop ke /etc/nginx/conf.d/ oleh backend API
    include /etc/nginx/conf.d/site_*.conf;

    # Shared proxy params
    include /etc/nginx/conf.d/proxy_params.conf;
}
