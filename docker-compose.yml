version: '3.9'

services:

  db:
    image: postgres:16-alpine
    container_name: waf-db
    environment:
      POSTGRES_DB: waf_saas
      POSTGRES_USER: waf_admin
      POSTGRES_PASSWORD: waf_secret_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/setup/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - waf_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waf_admin -d waf_saas"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: waf-backend
    environment:
      - DATABASE_URL=postgresql://waf_admin:waf_secret_2026@db:5432/waf_saas
      - SECRET_KEY=waf-pssn-2026-change-in-production
      - JWT_SECRET_KEY=jwt-pssn-2026-change-in-production
      - NGINX_CONF_DIR=/nginx-confd
      - MODSEC_RULES_DIR=/modsec-sites
      - LOG_DIR=/var/log/modsecurity
    volumes:
      - nginx_confd:/nginx-confd
      - modsec_sites:/modsec-sites
      - modsec_logs:/var/log/modsecurity
    depends_on:
      db:
        condition: service_healthy
    networks:
      - waf_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: waf-frontend
    networks:
      - waf_net
    restart: unless-stopped

  waf:
    build:
      context: ./docker
      dockerfile: Dockerfile.waf
    container_name: waf-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_confd:/etc/nginx/conf.d
      - ./nginx/conf.d/proxy_params.conf:/etc/nginx/conf.d/proxy_params.conf:ro
      - ./modsecurity/modsecurity.conf:/etc/nginx/modsecurity/modsecurity.conf:ro
      - ./modsecurity/main.conf:/etc/nginx/modsecurity/main.conf:ro
      - ./modsecurity/custom-rules:/etc/nginx/modsecurity/custom-rules:ro
      - ./modsecurity/crs-setup:/etc/nginx/modsecurity/crs-setup:ro
      - modsec_sites:/etc/nginx/modsecurity/sites
      - ./nginx/ssl:/etc/nginx/ssl
      - modsec_logs:/var/log/modsecurity
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - waf_net
    restart: unless-stopped

networks:
  waf_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24

volumes:
  postgres_data:
  nginx_confd:
  modsec_sites:
  modsec_logs:
  nginx_logs:
