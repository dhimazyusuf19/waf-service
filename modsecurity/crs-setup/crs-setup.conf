# ─────────────────────────────────────────────────────────────────────────────
# OWASP CRS Setup Configuration
# /etc/nginx/modsecurity/crs-setup/crs-setup.conf
# Disesuaikan untuk penelitian TA — threshold & paranoia level sesuai proposal
# ─────────────────────────────────────────────────────────────────────────────

# ─── Anomaly Scoring Threshold ────────────────────────────────────────────────
# Sesuai proposal: threshold = 5 (skor default OWASP CRS)
# Semakin kecil threshold → semakin sensitif (FNR turun, FPR naik)
SecAction \
    "id:900110,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.inbound_anomaly_score_threshold=5,\
    setvar:tx.outbound_anomaly_score_threshold=4"

# ─── Paranoia Level ───────────────────────────────────────────────────────────
# Level 1: Default, coverage baik, FPR rendah → sesuai untuk baseline
# Level 2: Lebih agresif → untuk enhanced WAF setelah tuning
SecAction \
    "id:900000,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.paranoia_level=1"

# Level untuk early blocking (lebih cepat blokir saat score tinggi)
SecAction \
    "id:900001,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.executing_paranoia_level=1"

# ─── HTTP Methods yang diizinkan ──────────────────────────────────────────────
SecAction \
    "id:900200,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:'tx.allowed_methods=GET HEAD POST PUT DELETE PATCH OPTIONS'"

# ─── Content-Type yang diizinkan untuk request body ──────────────────────────
SecAction \
    "id:900220,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |multipart/related| |text/xml| |application/xml| |application/soap+xml| |application/json| |application/cloudevents+json| |application/cloudevents-batch+json|'"

# ─── HTTP Version ─────────────────────────────────────────────────────────────
SecAction \
    "id:900230,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:'tx.allowed_http_versions=HTTP/1.0 HTTP/1.1 HTTP/2 HTTP/2.0'"

# ─── File Extension Restriction ──────────────────────────────────────────────
SecAction \
    "id:900240,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:'tx.restricted_extensions=.asa/ .asax/ .ascx/ .axd/ .backup/ .bak/ .bat/ .cdx/ .cer/ .cfg/ .cmd/ .com/ .config/ .conf/ .cs/ .csproj/ .csr/ .dat/ .db/ .dbf/ .dll/ .dos/ .htr/ .htw/ .ida/ .idc/ .idq/ .inc/ .ini/ .key/ .licx/ .lnk/ .log/ .mdb/ .old/ .pass/ .pdb/ .pol/ .printer/ .pwd/ .rdb/ .resources/ .resx/ .sql/ .swp/ .sys/ .vb/ .vbs/ .vbproj/ .vsdisco/ .webinfo/ .xsd/ .xsx/'"

# ─── HTTP Header Restriction ──────────────────────────────────────────────────
SecAction \
    "id:900250,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:'tx.restricted_headers=/proxy/ /lock-token/ /content-range/ /if/'"

# ─── Static Extension Bypass ──────────────────────────────────────────────────
# File statis tidak perlu body inspection (performa)
SecAction \
    "id:900990,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:'tx.static_extensions=/.jpg/ /.jpeg/ /.png/ /.gif/ /.js/ /.css/ /.ico/ /.svg/ /.webp/ /.woff/ /.woff2/ /.ttf/ /.eot/'"

# ─── Collection Timeout ──────────────────────────────────────────────────────
SecAction \
    "id:900700,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.dos_burst_time_slice=60,\
    setvar:tx.dos_counter_threshold=100,\
    setvar:tx.dos_block_timeout=600"

# ─── GeoIP (opsional, jika data tersedia) ────────────────────────────────────
# SecGeoLookupDb /etc/nginx/GeoLite2-Country.mmdb
