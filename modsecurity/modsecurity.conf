# ─────────────────────────────────────────────────────────────────────────────
# ModSecurity Configuration
# /etc/nginx/modsecurity/modsecurity.conf
# ─────────────────────────────────────────────────────────────────────────────

# ─── Engine Mode ──────────────────────────────────────────────────────────────
# DetectionOnly = log saja, tidak blokir (untuk tuning awal)
# On            = aktif blokir (production)
SecRuleEngine On

# ─── Request Body ─────────────────────────────────────────────────────────────
SecRequestBodyAccess On
SecRequestBodyLimit 13107200          # 12.5 MB
SecRequestBodyNoFilesLimit 131072     # 128 KB
SecRequestBodyLimitAction Reject

# ─── Response Body ────────────────────────────────────────────────────────────
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html text/xml application/json
SecResponseBodyLimit 524288           # 512 KB
SecResponseBodyLimitAction ProcessPartial

# ─── Filesystem ───────────────────────────────────────────────────────────────
SecTmpDir /tmp/
SecDataDir /tmp/
SecUploadDir /tmp/

# ─── Audit Log ────────────────────────────────────────────────────────────────
SecAuditEngine RelevantOnly           # Log hanya yang relevan (blocked + error)
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLog /var/log/modsecurity/audit.log
SecAuditLogParts ABCFHIZ
SecAuditLogType Serial
SecAuditLogFormat JSON                # Format JSON untuk parsing mudah

# ─── Debug Log ────────────────────────────────────────────────────────────────
SecDebugLog /var/log/modsecurity/debug.log
SecDebugLogLevel 1                    # 0=off, 9=max. 1=error saja di production

# ─── Rule Engine Settings ─────────────────────────────────────────────────────
SecDefaultAction "phase:1,log,auditlog,pass"

# ─── Unicode Map ──────────────────────────────────────────────────────────────
SecUnicodeMapFile unicode.mapping 20127

# ─── PCRE Settings ────────────────────────────────────────────────────────────
SecPcreMatchLimit            100000
SecPcreMatchLimitRecursion   100000

# ─── Status Collection ────────────────────────────────────────────────────────
SecStatusEngine On

# ─── HTTP Methods yang diizinkan ──────────────────────────────────────────────
SecRule REQUEST_METHOD "!@within GET HEAD POST PUT DELETE PATCH OPTIONS" \
    "id:900200,phase:1,t:none,deny,status:405,\
    msg:'Method Not Allowed',\
    tag:'POLICY/METHOD_NOT_ALLOWED'"

# ─── HTTP Protocol Version ────────────────────────────────────────────────────
SecRule REQUEST_PROTOCOL "!@within HTTP/1.0 HTTP/1.1 HTTP/2.0 HTTP/2" \
    "id:900210,phase:1,t:none,deny,status:505,\
    msg:'HTTP Protocol Version Not Allowed'"

# ─── Content-Type Enforcement ─────────────────────────────────────────────────
SecRule REQUEST_HEADERS:Content-Type \
    "!@rx ^(application/(x-www-form-urlencoded|json|xml|octet-stream)|multipart/form-data|text/plain)" \
    "id:900220,phase:1,chain,t:lowercase"
    SecRule REQUEST_METHOD "@within POST PUT PATCH" \
        "deny,status:400,msg:'Invalid Content-Type'"
