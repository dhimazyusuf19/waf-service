# ─────────────────────────────────────────────────────────────────────────────
# Custom Rule: Anomaly Scoring & Blocking Evaluation
# File: /etc/nginx/modsecurity/custom-rules/1003-anomaly-scoring.conf
# Sesuai Proposal TA — Anomaly Scoring Threshold-Based (Gambar 3.2)
#
# Sistem ini menggabungkan semua score dari custom rules dan OWASP CRS,
# kemudian membuat keputusan final BLOCK / PASS berdasarkan threshold.
# ─────────────────────────────────────────────────────────────────────────────

# ─── Threshold settings ───────────────────────────────────────────────────────
# Sesuai proposal: threshold = 5 (default OWASP CRS)
# Custom rules kita menambah anomaly score ke tx.anomaly_score
SecAction \
    "id:1003000,\
    phase:1,\
    nolog,\
    pass,\
    setvar:tx.waf_inbound_threshold=5,\
    setvar:tx.waf_outbound_threshold=4,\
    setvar:tx.total_threat_score=0"

# ─── Rule 1003001: Gabungkan semua custom scores ke anomaly_score ─────────────
SecAction \
    "id:1003001,\
    phase:1,\
    nolog,\
    pass,\
    setvar:tx.total_threat_score=+%{tx.referer_bypass_score},\
    setvar:tx.total_threat_score=+%{tx.scraping_score},\
    setvar:tx.total_threat_score=+%{tx.hotlink_score}"

# ─── Rule 1003002: Propagasi ke OWASP anomaly_score ──────────────────────────
SecAction \
    "id:1003002,\
    phase:1,\
    nolog,\
    pass,\
    setvar:tx.anomaly_score=+%{tx.total_threat_score}"

# ─── Rule 1003003: Final blocking evaluation (Phase 1) ───────────────────────
SecRule TX:anomaly_score "@ge %{tx.waf_inbound_threshold}" \
    "id:1003003,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'WAF Final Block: Anomaly score exceeded inbound threshold',\
    logdata:'Total score: %{tx.anomaly_score} | \
             Referer bypass: %{tx.referer_bypass_score} | \
             Scraping: %{tx.scraping_score} | \
             Hotlink: %{tx.hotlink_score} | \
             OWASP: %{tx.sql_injection_score},%{tx.xss_score} | \
             URI: %{REQUEST_URI} | \
             IP: %{REMOTE_ADDR} | \
             UA: %{REQUEST_HEADERS.User-Agent}',\
    tag:'WAF-BLOCK',\
    tag:'ANOMALY-SCORE',\
    severity:'CRITICAL'"

# ─── Rule 1003004: Log request yang berhasil pass (untuk FPR/FNR calculation) ─
SecRule TX:anomaly_score "@lt %{tx.waf_inbound_threshold}" \
    "id:1003004,\
    phase:5,\
    pass,\
    log,\
    msg:'WAF Pass: Request allowed',\
    logdata:'Score: %{tx.anomaly_score} | URI: %{REQUEST_URI} | IP: %{REMOTE_ADDR}',\
    tag:'WAF-PASS'"

# ─── Rule 1003005: Outbound evaluation (response inspection) ─────────────────
SecRule TX:outbound_anomaly_score "@ge %{tx.waf_outbound_threshold}" \
    "id:1003005,\
    phase:4,\
    deny,\
    status:403,\
    log,\
    msg:'WAF Final Block: Outbound anomaly score exceeded threshold',\
    logdata:'Outbound score: %{tx.outbound_anomaly_score} | URI: %{REQUEST_URI}',\
    tag:'WAF-BLOCK',\
    tag:'OUTBOUND'"

# ─── Rule 1003006: Rate limiting deteksi (tambahan score dari burst request) ──
# Jika response adalah 429 (Too Many Requests dari Nginx), log sebagai scraping
SecRule RESPONSE_STATUS "@streq 429" \
    "id:1003006,\
    phase:3,\
    pass,\
    log,\
    msg:'Anti-Scraping: Rate limit triggered',\
    logdata:'Rate limited URI: %{REQUEST_URI} | IP: %{REMOTE_ADDR}',\
    tag:'RATE-LIMIT',\
    tag:'ANTI-SCRAPING'"
