# ─────────────────────────────────────────────────────────────────────────────
# Custom Rule: Whitelist / False Positive Prevention
# File: /etc/nginx/modsecurity/custom-rules/1004-whitelist.conf
# Mencegah FPR (False Positive Rate) tinggi — sesuai target proposal < 1%
# ─────────────────────────────────────────────────────────────────────────────

# ─── Rule 1004001: Whitelist Googlebot & Bingbot (crawler sah) ───────────────
SecRule REQUEST_HEADERS:User-Agent \
    "@rx (?i)(googlebot|bingbot|slurp|duckduckbot|baiduspider|yandexbot)" \
    "id:1004001,\
    phase:1,\
    t:none,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=1001001,\
    ctl:ruleRemoveById=1001002,\
    msg:'Whitelist: Legitimate search engine crawler'"

# ─── Rule 1004002: Whitelist internal monitoring (Prometheus, health check) ───
SecRule REMOTE_ADDR \
    "@ipMatch 172.20.0.0/24,127.0.0.1" \
    "id:1004002,\
    phase:1,\
    t:none,\
    pass,\
    nolog,\
    ctl:ruleEngine=Off,\
    msg:'Whitelist: Internal network bypass'"

# ─── Rule 1004003: Whitelist /health dan /ping endpoint ──────────────────────
SecRule REQUEST_URI \
    "@rx ^/(health|ping|status|favicon\.ico|robots\.txt)$" \
    "id:1004003,\
    phase:1,\
    t:none,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=1001001-1001010,\
    ctl:ruleRemoveById=1002001-1002005"

# ─── Rule 1004004: Whitelist API dengan valid API key ────────────────────────
# Jika ada header X-API-Key yang valid, bypass beberapa rule
SecRule REQUEST_HEADERS:X-API-Key \
    "@rx ^[A-Za-z0-9\-_]{32,64}$" \
    "id:1004004,\
    phase:1,\
    t:none,\
    pass,\
    nolog,\
    setvar:tx.api_authenticated=1,\
    ctl:ruleRemoveById=1000001"

# ─── Rule 1004005: Whitelist multipart form upload ────────────────────────────
# Upload file sah tidak perlu Referer validation
SecRule REQUEST_HEADERS:Content-Type \
    "@rx ^multipart/form-data" \
    "id:1004005,\
    phase:1,\
    t:none,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=1000001"

# ─── Rule 1004006: Unset score untuk request yang sudah diwhitelist ──────────
SecRule TX:api_authenticated "@eq 1" \
    "id:1004006,\
    phase:1,\
    t:none,\
    pass,\
    nolog,\
    setvar:tx.referer_bypass_score=0"
