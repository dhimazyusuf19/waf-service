# =============================================================================
# ModSecurity Custom Rules — OWASP Top 10:2025
# ShieldWAF — Taqiya Nabilla Nathania Afnani — PSSN 2026
#
# Berdasarkan: https://owasp.org/Top10/2025/
# Sumber referensi: R-Galarza/OWASP-TOP-10---Web-Application-Security-Risks
#
# Cakupan:
#   A01:2025 — Broken Access Control (termasuk SSRF)
#   A02:2025 — Security Misconfiguration
#   A03:2025 — Software Supply Chain Failures
#   A04:2025 — Cryptographic Failures
#   A05:2025 — Injection (SQLi, XSS, LDAPi, CMDi, XXE, Template)
#   A06:2025 — Insecure Design
#   A07:2025 — Authentication Failures
#   A08:2025 — Software or Data Integrity Failures
#   A09:2025 — Security Logging & Alerting Failures
#   A10:2025 — Mishandling of Exceptional Conditions
# =============================================================================

# ─── Inisialisasi score per kategori ─────────────────────────────────────────
SecAction \
  "id:2000000,phase:1,nolog,pass,t:none,\
  setvar:tx.a01_score=0,\
  setvar:tx.a02_score=0,\
  setvar:tx.a04_score=0,\
  setvar:tx.a05_score=0,\
  setvar:tx.a07_score=0,\
  setvar:tx.a08_score=0,\
  setvar:tx.a10_score=0"


# =============================================================================
# A01:2025 — BROKEN ACCESS CONTROL (termasuk SSRF)
# CWE-22, CWE-284, CWE-285, CWE-352, CWE-639, CWE-918
# =============================================================================

# Rule A01-001: Path Traversal / Directory Traversal
SecRule REQUEST_URI|REQUEST_FILENAME \
  "@rx (?:\.\.[\\/]|\.\.%2[Ff]|\.\.%5[Cc]|%2[Ee]%2[Ee][\\/])" \
  "id:2001001,phase:1,t:none,t:urlDecodeUni,t:lowercase,\
  setvar:tx.a01_score=+7,\
  msg:'A01:2025 Broken Access Control - Path Traversal',\
  logdata:'URI: %{REQUEST_URI}',\
  tag:'OWASP_2025/A01',tag:'PATH-TRAVERSAL',severity:'HIGH'"

# Rule A01-002: Akses file sensitif sistem
SecRule REQUEST_URI \
  "@rx (?:/etc/(?:passwd|shadow|hosts|hostname|resolv\.conf|issue)|/proc/self/environ|/windows/(?:system32|win\.ini)|/boot\.ini)" \
  "id:2001002,phase:1,t:none,t:urlDecodeUni,t:lowercase,\
  deny,status:403,\
  msg:'A01:2025 Broken Access Control - Sensitive File Access',\
  tag:'OWASP_2025/A01',tag:'FILE-DISCLOSURE',severity:'CRITICAL'"

# Rule A01-003: IDOR — Manipulasi parameter ID yang mencurigakan
SecRule REQUEST_URI \
  "@rx (?:/api/(?:users|admin|accounts|profile|user)/(?:\d+|[a-f0-9\-]{36}))" \
  "id:2001003,phase:1,t:none,chain,\
  msg:'A01:2025 Broken Access Control - Possible IDOR',\
  tag:'OWASP_2025/A01',tag:'IDOR'"
  SecRule &REQUEST_HEADERS:Authorization "@eq 0" \
    "setvar:tx.a01_score=+3"

# Rule A01-004: SSRF — Server-Side Request Forgery (masuk A01 di 2025)
SecRule REQUEST_BODY|ARGS \
  "@rx (?:https?|ftp|file|dict|gopher|ldap)://(?:169\.254\.169\.254|metadata\.google\.internal|100\.100\.100\.200|127\.0\.0\.1|localhost|0\.0\.0\.0|\[::1\]|0177\.|0x7[Ff])" \
  "id:2001005,phase:2,t:none,t:urlDecodeUni,t:lowercase,\
  deny,status:403,\
  msg:'A01:2025 Broken Access Control - SSRF to Internal Resource',\
  logdata:'Payload: %{MATCHED_VAR}',\
  tag:'OWASP_2025/A01',tag:'SSRF',severity:'CRITICAL'"

# Rule A01-005: SSRF via protokol berbahaya
SecRule REQUEST_BODY|ARGS \
  "@rx (?:dict://|gopher://|file://|ldap://|tftp://|sftp://|jar://)" \
  "id:2001006,phase:2,t:none,t:urlDecodeUni,t:lowercase,\
  deny,status:403,\
  msg:'A01:2025 Broken Access Control - SSRF Dangerous Protocol',\
  tag:'OWASP_2025/A01',tag:'SSRF',severity:'CRITICAL'"

# Rule A01-006: HTTP Method berbahaya
SecRule REQUEST_METHOD \
  "@rx ^(?:TRACE|TRACK|CONNECT|DEBUG|PROPFIND|PROPPATCH|MKCOL|COPY|MOVE|LOCK|UNLOCK|SEARCH)$" \
  "id:2001007,phase:1,t:none,\
  deny,status:405,\
  msg:'A01:2025 Broken Access Control - Dangerous HTTP Method',\
  tag:'OWASP_2025/A01',severity:'MEDIUM'"

# Rule A01-007: Akses endpoint admin tanpa auth
SecRule REQUEST_URI \
  "@rx ^/(?:admin|administrator|wp-admin|phpmyadmin|manager|console|dashboard|panel|control)" \
  "id:2001008,phase:1,t:none,chain,\
  msg:'A01:2025 Broken Access Control - Admin Endpoint without Auth',\
  tag:'OWASP_2025/A01'"
  SecRule &REQUEST_HEADERS:Authorization "@eq 0" \
    "setvar:tx.a01_score=+4"

# Evaluasi A01 score
SecRule TX:a01_score "@ge 5" \
  "id:2001099,phase:1,t:none,deny,status:403,\
  msg:'A01:2025 Broken Access Control - Score Exceeded',\
  logdata:'A01 Score: %{tx.a01_score}',\
  tag:'OWASP_2025/A01',severity:'HIGH'"


# =============================================================================
# A02:2025 — SECURITY MISCONFIGURATION
# CWE-16, CWE-116, CWE-209, CWE-611, CWE-732
# =============================================================================

# Rule A02-001: Kebocoran informasi stack trace / debug
SecRule RESPONSE_BODY \
  "@rx (?:exception|stack trace|at\s+[\w\.]+\([\w\.]+:\d+\)|line \d+ in|traceback \(most recent|fatal error:|parse error:|syntax error:)" \
  "id:2002001,phase:4,t:none,t:lowercase,\
  setvar:tx.a02_score=+5,\
  msg:'A02:2025 Security Misconfiguration - Stack Trace Leaked in Response',\
  tag:'OWASP_2025/A02',tag:'INFO-LEAK',severity:'MEDIUM'"

# Rule A02-002: Header server yang expose versi
SecRule RESPONSE_HEADERS:Server \
  "@rx (?:Apache/\d|nginx/\d|IIS/\d|PHP/\d|OpenSSL/\d)" \
  "id:2002002,phase:3,t:none,\
  setvar:tx.a02_score=+2,\
  msg:'A02:2025 Security Misconfiguration - Server Version Exposed',\
  tag:'OWASP_2025/A02',tag:'INFO-DISCLOSURE'"

# Rule A02-003: Akses file konfigurasi
SecRule REQUEST_URI \
  "@rx (?:\.env|\.git/|\.htaccess|\.htpasswd|web\.config|app\.config|database\.yml|config\.php|wp-config\.php|settings\.py|\.aws/credentials|\.ssh/id_rsa)" \
  "id:2002003,phase:1,t:none,t:urlDecodeUni,t:lowercase,\
  deny,status:403,\
  msg:'A02:2025 Security Misconfiguration - Config File Access',\
  tag:'OWASP_2025/A02',tag:'CONFIG-DISCLOSURE',severity:'CRITICAL'"

# Rule A02-004: Akses backup dan file sementara
SecRule REQUEST_URI \
  "@rx (?:\.bak$|\.backup$|\.old$|\.orig$|\.tmp$|\.swp$|~$|\.log$|\.sql$|\.dump$|\.tar\.gz$|\.zip$)" \
  "id:2002004,phase:1,t:none,t:lowercase,\
  deny,status:403,\
  msg:'A02:2025 Security Misconfiguration - Backup File Access',\
  tag:'OWASP_2025/A02',severity:'HIGH'"

# Rule A02-005: Akses direktori default tools
SecRule REQUEST_URI \
  "@rx ^/(?:phpmyadmin|adminer|pma|myadmin|phpinfo|test|demo|sample|examples?|install|setup|config)(?:/|$)" \
  "id:2002005,phase:1,t:none,t:lowercase,\
  deny,status:403,\
  msg:'A02:2025 Security Misconfiguration - Default Tool Path',\
  tag:'OWASP_2025/A02',severity:'HIGH'"

# Evaluasi A02 score
SecRule TX:a02_score "@ge 5" \
  "id:2002099,phase:4,t:none,deny,status:403,\
  msg:'A02:2025 Security Misconfiguration - Score Exceeded',\
  tag:'OWASP_2025/A02',severity:'HIGH'"


# =============================================================================
# A04:2025 — CRYPTOGRAPHIC FAILURES
# CWE-259, CWE-295, CWE-310, CWE-319, CWE-321, CWE-326, CWE-327
# =============================================================================

# Rule A04-001: Transmisi data sensitif via HTTP (bukan HTTPS)
SecRule REQUEST_HEADERS:Host "@rx ^[^:]+$" \
  "id:2004001,phase:1,t:none,chain,\
  msg:'A04:2025 Cryptographic Failures - Sensitive Data over HTTP',\
  tag:'OWASP_2025/A04'"
  SecRule REQUEST_URI "@rx (?:/login|/register|/password|/payment|/checkout|/auth|/api/token)" \
    "chain"
    SecRule &REQUEST_HEADERS:X-Forwarded-Proto "@eq 0" \
      "setvar:tx.a04_score=+3"

# Rule A04-002: Deteksi password atau kunci di URL (jangan sampai di log)
SecRule REQUEST_URI \
  "@rx (?:[?&](?:password|passwd|pwd|secret|token|api_key|apikey|auth)=)" \
  "id:2004002,phase:1,t:none,t:urlDecodeUni,t:lowercase,\
  setvar:tx.a04_score=+5,\
  msg:'A04:2025 Cryptographic Failures - Credentials in URL',\
  tag:'OWASP_2025/A04',tag:'CREDENTIAL-LEAK',severity:'HIGH'"

# Rule A04-003: Weak hash di response (MD5 terdeteksi sebagai kredensial)
SecRule RESPONSE_BODY \
  "@rx \"password\":\s*\"[a-f0-9]{32}\"" \
  "id:2004003,phase:4,t:none,\
  setvar:tx.a04_score=+8,\
  msg:'A04:2025 Cryptographic Failures - MD5 Hash in Response (possible plaintext-equivalent)',\
  tag:'OWASP_2025/A04',severity:'HIGH'"


# =============================================================================
# A05:2025 — INJECTION
# CWE-77, CWE-78, CWE-79, CWE-88, CWE-89, CWE-90, CWE-91, CWE-917
# (SQLi, XSS, CMDi, LDAPi, XXE, Template Injection, NoSQLi)
# =============================================================================

# Rule A05-001: SQL Injection — teknik dasar
SecRule REQUEST_URI|REQUEST_BODY|ARGS \
  "@rx (?:'|\"|;|--|\#|\/\*|\*\/|xp_|exec\s*\(|UNION\s+(?:ALL\s+)?SELECT|INSERT\s+INTO|UPDATE\s+\w+\s+SET|DELETE\s+FROM|DROP\s+(?:TABLE|DATABASE)|ALTER\s+TABLE|TRUNCATE\s+TABLE|CREATE\s+(?:TABLE|USER)|INFORMATION_SCHEMA|sys\.(?:tables|columns|objects)|SLEEP\s*\(|BENCHMARK\s*\(|WAITFOR\s+DELAY)" \
  "id:2005001,phase:2,t:none,t:urlDecodeUni,t:lowercase,\
  setvar:tx.a05_score=+8,\
  msg:'A05:2025 Injection - SQL Injection Attempt',\
  logdata:'Payload: %{MATCHED_VAR}',\
  tag:'OWASP_2025/A05',tag:'SQLi',severity:'CRITICAL'"

# Rule A05-002: SQL Injection — blind/time-based
SecRule REQUEST_URI|ARGS|REQUEST_BODY \
  "@rx (?:(?:AND|OR)\s+(?:\d+\s*[=<>!]+\s*\d+|\w+\s*=\s*\w+)|(?:AND|OR)\s+\d+\s*=\s*\d+--)" \
  "id:2005002,phase:2,t:none,t:urlDecodeUni,t:lowercase,\
  setvar:tx.a05_score=+6,\
  msg:'A05:2025 Injection - Blind SQL Injection Pattern',\
  tag:'OWASP_2025/A05',tag:'SQLi-BLIND',severity:'HIGH'"

# Rule A05-003: XSS — Cross-Site Scripting
SecRule REQUEST_URI|ARGS|REQUEST_BODY|REQUEST_HEADERS:Referer \
  "@rx (?:<script|javascript:|vbscript:|on(?:load|error|click|mouseover|focus|blur|change|submit|reset|select|abort|unload|beforeunload|resize|scroll|hashchange|popstate|message|storage|online|offline|pagehide|pageshow|readystatechange|visibilitychange)(?:\s*)=|<(?:img|svg|body|object|embed|frame|iframe|link|base|meta|input|button|a)\s[^>]*(?:src|href|action|formaction|data|xlink:href)\s*=\s*(?:javascript:|data:text/html))" \
  "id:2005003,phase:2,t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase,\
  setvar:tx.a05_score=+7,\
  msg:'A05:2025 Injection - XSS Cross-Site Scripting',\
  logdata:'Payload: %{MATCHED_VAR}',\
  tag:'OWASP_2025/A05',tag:'XSS',severity:'HIGH'"

# Rule A05-004: XSS — encoded dan bypass teknik lanjutan
SecRule REQUEST_URI|ARGS|REQUEST_BODY \
  "@rx (?:%3[Cc]script|%3[Cc]img|&#x3[Cc];|&lt;script|\\x3c(?:script|img|svg|body)|\\u003[Cc]|expression\s*\(|eval\s*\(|setTimeout\s*\(|setInterval\s*\(|Function\s*\()" \
  "id:2005004,phase:2,t:none,t:urlDecodeUni,\
  setvar:tx.a05_score=+7,\
  msg:'A05:2025 Injection - XSS Encoded Bypass Attempt',\
  tag:'OWASP_2025/A05',tag:'XSS-BYPASS',severity:'HIGH'"

# Rule A05-005: OS Command Injection
SecRule REQUEST_URI|ARGS|REQUEST_BODY \
  "@rx (?:(?:;|\||&|`|\$\(|\${)(?:\s*)(?:cat|ls|pwd|id|whoami|uname|wget|curl|bash|sh|python|perl|ruby|nc|netcat|ncat|telnet|ssh|rm\s+-rf|mkfifo|chmod|chown|passwd|shadow|/etc/|/bin/|/usr/|/var/)|\|\s*(?:cat|ls|id|whoami|uname)|`(?:cat|ls|id|whoami)`|\$\((?:cat|id|whoami)\))" \
  "id:2005005,phase:2,t:none,t:urlDecodeUni,t:lowercase,\
  setvar:tx.a05_score=+10,\
  msg:'A05:2025 Injection - OS Command Injection',\
  logdata:'Payload: %{MATCHED_VAR}',\
  tag:'OWASP_2025/A05',tag:'CMDi',severity:'CRITICAL'"

# Rule A05-006: LDAP Injection
SecRule REQUEST_URI|ARGS|REQUEST_BODY \
  "@rx (?:\*\)|(?:\(|\)|\||&)[^\)]*(?:cn|uid|mail|ou|dc|objectClass)\s*=|\)\s*\((?:cn|uid|mail|ou|dc)=\*)" \
  "id:2005006,phase:2,t:none,t:urlDecodeUni,t:lowercase,\
  setvar:tx.a05_score=+7,\
  msg:'A05:2025 Injection - LDAP Injection Attempt',\
  tag:'OWASP_2025/A05',tag:'LDAPi',severity:'HIGH'"

# Rule A05-007: XXE — XML External Entity Injection
SecRule REQUEST_BODY \
  "@rx (?:<!(?:DOCTYPE|ENTITY)\s[^>]*(?:SYSTEM|PUBLIC)\s+[\"'](?:file://|https?://|ftp://|php://|jar://|expect://)[\"']|<!ENTITY\s+\w+\s+SYSTEM)" \
  "id:2005007,phase:2,t:none,t:urlDecodeUni,\
  setvar:tx.a05_score=+9,\
  msg:'A05:2025 Injection - XXE XML External Entity',\
  logdata:'Payload: %{MATCHED_VAR}',\
  tag:'OWASP_2025/A05',tag:'XXE',severity:'CRITICAL'"

# Rule A05-008: Template Injection (SSTI)
SecRule REQUEST_URI|ARGS|REQUEST_BODY \
  "@rx (?:\{\{.*\}\}|\{%.*%\}|\$\{.*\}|<%.*%>|#\{.*\}|\[\[.*\]\]|#{.*})" \
  "id:2005008,phase:2,t:none,t:urlDecodeUni,\
  setvar:tx.a05_score=+7,\
  msg:'A05:2025 Injection - Server-Side Template Injection',\
  logdata:'Payload: %{MATCHED_VAR}',\
  tag:'OWASP_2025/A05',tag:'SSTI',severity:'HIGH'"

# Rule A05-009: NoSQL Injection
SecRule REQUEST_BODY|ARGS \
  "@rx (?:\$(?:where|ne|gt|lt|gte|lte|in|nin|exists|regex|options|or|and|not|nor|all|elemMatch|size|type|mod|text|geoWithin|geoIntersects|near|nearSphere|within|maxDistance)\s*[:\{]|\{\s*\"\$)" \
  "id:2005009,phase:2,t:none,t:urlDecodeUni,t:lowercase,\
  setvar:tx.a05_score=+7,\
  msg:'A05:2025 Injection - NoSQL Injection Attempt',\
  tag:'OWASP_2025/A05',tag:'NoSQLi',severity:'HIGH'"

# Rule A05-010: HTML Injection / Content Injection
SecRule ARGS|REQUEST_BODY \
  "@rx (?:<(?:iframe|frame|object|embed|form|input|button|textarea|select|option)\s[^>]*|<a\s[^>]*href\s*=\s*(?:javascript:|vbscript:))" \
  "id:2005010,phase:2,t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase,\
  setvar:tx.a05_score=+5,\
  msg:'A05:2025 Injection - HTML Injection',\
  tag:'OWASP_2025/A05',tag:'HTMLi',severity:'MEDIUM'"

# Evaluasi A05 — INJECTION (threshold rendah karena critical)
SecRule TX:a05_score "@ge 7" \
  "id:2005099,phase:2,t:none,deny,status:403,\
  msg:'A05:2025 Injection Detected - Score Exceeded',\
  logdata:'A05 Score: %{tx.a05_score}',\
  tag:'OWASP_2025/A05',severity:'CRITICAL'"


# =============================================================================
# A07:2025 — AUTHENTICATION FAILURES
# CWE-287, CWE-294, CWE-295, CWE-297, CWE-302, CWE-304, CWE-306, CWE-384
# =============================================================================

# Rule A07-001: Credential Stuffing / Brute Force deteksi pola
SecRule REQUEST_URI \
  "@rx ^/(?:login|signin|auth|api/auth/login|api/token|oauth/token|password)" \
  "id:2007001,phase:1,t:none,\
  setvar:tx.a07_score=+1,\
  msg:'A07:2025 Authentication Failures - Login Endpoint Access',\
  tag:'OWASP_2025/A07'"

# Rule A07-002: Default credentials yang umum digunakan
SecRule REQUEST_BODY \
  "@rx (?:\"(?:password|passwd|pwd)\"\s*:\s*\"(?:password|123456|admin|test|guest|root|letmein|qwerty|abc123|111111|iloveyou|sunshine|master|dragon|pass|hello|charlie|donald|password1|123456789|welcome|monkey|shadow|ashley|bailey|shadow|sunshine|master)\")" \
  "id:2007002,phase:2,t:none,t:lowercase,\
  setvar:tx.a07_score=+5,\
  msg:'A07:2025 Authentication Failures - Default/Weak Password Attempt',\
  tag:'OWASP_2025/A07',tag:'BRUTE-FORCE',severity:'MEDIUM'"

# Rule A07-003: Token/session manipulation
SecRule REQUEST_HEADERS:Cookie \
  "@rx (?:(?:session|token|auth|jwt)=[a-zA-Z0-9+/=]{4,}(?:\.[a-zA-Z0-9+/=]{4,}){0,2})" \
  "id:2007003,phase:1,t:none,chain,\
  msg:'A07:2025 Authentication Failures - Suspicious Token Pattern',\
  tag:'OWASP_2025/A07'"
  SecRule REQUEST_HEADERS:Cookie \
    "@rx (?:eyJ[A-Za-z0-9\-_]+\.eyJ[A-Za-z0-9\-_]+\.)" \
    "setvar:tx.a07_score=+1"

# Rule A07-004: Password reset bypass
SecRule REQUEST_URI \
  "@rx /(?:reset.password|forgot.password|password.reset|change.password)" \
  "id:2007004,phase:1,t:none,chain,\
  msg:'A07:2025 Authentication Failures - Password Reset Endpoint',\
  tag:'OWASP_2025/A07'"
  SecRule &REQUEST_HEADERS:Referer "@eq 0" \
    "setvar:tx.a07_score=+3"


# =============================================================================
# A08:2025 — SOFTWARE OR DATA INTEGRITY FAILURES
# CWE-345, CWE-346, CWE-353, CWE-494, CWE-502, CWE-565, CWE-784, CWE-829
# =============================================================================

# Rule A08-001: Deserialisasi berbahaya — Java
SecRule REQUEST_BODY|REQUEST_HEADERS:Content-Type \
  "@rx (?:rO0ABX|aced0005|aced\s*0005|java\.io\.Serializable|java\.lang\.Runtime|java\.lang\.ProcessBuilder)" \
  "id:2008001,phase:2,t:none,\
  setvar:tx.a08_score=+9,\
  msg:'A08:2025 Data Integrity Failures - Java Deserialization Attack',\
  logdata:'Payload: %{MATCHED_VAR}',\
  tag:'OWASP_2025/A08',tag:'DESERIALIZATION',severity:'CRITICAL'"

# Rule A08-002: Deserialisasi — PHP unserialize
SecRule REQUEST_BODY|ARGS \
  "@rx (?:O:\d+:\"[^\"]+\":\d+:\{|a:\d+:\{|s:\d+:\"[^\"]*\";|i:\d+;|b:[01];)" \
  "id:2008002,phase:2,t:none,t:urlDecodeUni,\
  setvar:tx.a08_score=+7,\
  msg:'A08:2025 Data Integrity Failures - PHP Deserialization Attempt',\
  tag:'OWASP_2025/A08',tag:'DESERIALIZATION',severity:'HIGH'"

# Rule A08-003: Deserialisasi — Python pickle
SecRule REQUEST_BODY \
  "@rx (?:\\x80\\x04|\\x80\\x02|cos\nsystem|cposix\nsystem|__reduce__|__reduce_ex__|pickle\.loads)" \
  "id:2008003,phase:2,t:none,\
  setvar:tx.a08_score=+9,\
  msg:'A08:2025 Data Integrity Failures - Python Pickle Deserialization',\
  tag:'OWASP_2025/A08',tag:'DESERIALIZATION',severity:'CRITICAL'"

# Rule A08-004: Deteksi upload file berbahaya
SecRule FILES_NAMES|REQUEST_HEADERS:Content-Disposition \
  "@rx (?:\.(?:php[3-7s]?|phtml|phar|shtml|cgi|pl|py|rb|asp[x]?|jsp[x]?|cfm|exe|sh|bash|cmd|bat|ps1|vbs|jar|war|class)$)" \
  "id:2008004,phase:2,t:none,t:lowercase,\
  deny,status:403,\
  msg:'A08:2025 Data Integrity Failures - Malicious File Upload',\
  tag:'OWASP_2025/A08',tag:'FILE-UPLOAD',severity:'CRITICAL'"

# Rule A08-005: JWT algorithm confusion (alg:none)
SecRule REQUEST_HEADERS:Authorization|ARGS:token|ARGS:jwt \
  "@rx eyJ[A-Za-z0-9+/=]*" \
  "id:2008005,phase:1,t:none,chain,\
  msg:'A08:2025 Data Integrity Failures - JWT Algorithm None Attack',\
  tag:'OWASP_2025/A08',tag:'JWT-ATTACK'"
  SecRule MATCHED_VAR "@rx eyJ[A-Za-z0-9\-_]*\.eyJ[A-Za-z0-9\-_]*\.$" \
    "setvar:tx.a08_score=+9,\
    deny,status:403"

# Evaluasi A08 score
SecRule TX:a08_score "@ge 7" \
  "id:2008099,phase:2,t:none,deny,status:403,\
  msg:'A08:2025 Software or Data Integrity Failures - Score Exceeded',\
  logdata:'A08 Score: %{tx.a08_score}',\
  tag:'OWASP_2025/A08',severity:'CRITICAL'"


# =============================================================================
# A09:2025 — SECURITY LOGGING & ALERTING FAILURES
# CWE-117, CWE-223, CWE-532, CWE-778
# =============================================================================

# Rule A09-001: Log injection / log forgery
SecRule REQUEST_URI|ARGS|REQUEST_BODY \
  "@rx (?:%0[aAdD]|\\r|\\n|\r|\n)(?:.*(?:GET|POST|PUT|DELETE|HTTP/)" \
  "id:2009001,phase:2,t:none,t:urlDecodeUni,\
  deny,status:400,\
  msg:'A09:2025 Logging Failures - Log Injection/Forgery Attempt',\
  logdata:'Payload: %{MATCHED_VAR}',\
  tag:'OWASP_2025/A09',tag:'LOG-INJECTION',severity:'HIGH'"

# Rule A09-002: Deteksi scanner keamanan (untuk logging awareness)
SecRule REQUEST_HEADERS:User-Agent \
  "@rx (?i)(?:nikto|nessus|openvas|masscan|nmap|sqlmap|nuclei|burpsuite|zaproxy|w3af|acunetix|appscan|webinspect|qualys|havij|pangolin|jbrofuzz|grabber|golismero|skipfish|wfuzz|dirb|dirbuster|gobuster|ffuf|hydra|medusa|john|hashcat|metasploit|msfconsole)" \
  "id:2009002,phase:1,t:none,\
  deny,status:403,\
  msg:'A09:2025 Logging Failures - Security Scanner Detected',\
  logdata:'Scanner UA: %{REQUEST_HEADERS.User-Agent}',\
  tag:'OWASP_2025/A09',tag:'SCANNER',severity:'HIGH'"

# Rule A09-003: Error information leakage dalam response
SecRule RESPONSE_BODY \
  "@rx (?:ORA-\d{5}|mysql_fetch|pg_query|mssql_query|sqlite_query|Warning.*mysql|Warning.*pg_|fatal error|call stack|stack trace|at line \d|sql syntax|you have an error in your sql)" \
  "id:2009003,phase:4,t:none,t:lowercase,\
  msg:'A09:2025 Logging Failures - Database Error Leaked',\
  logdata:'Leaked info detected in response',\
  tag:'OWASP_2025/A09',tag:'INFO-LEAK',severity:'MEDIUM'"


# =============================================================================
# A10:2025 — MISHANDLING OF EXCEPTIONAL CONDITIONS
# CWE-390, CWE-391, CWE-392, CWE-393, CWE-394, CWE-395, CWE-396, CWE-754, CWE-755
# =============================================================================

# Rule A10-001: Integer overflow / large number injection
SecRule ARGS|REQUEST_BODY \
  "@rx (?:\d{15,}|-\d{10,}|0x[fF]{8,}|2147483648|9999999999|4294967296)" \
  "id:2010001,phase:2,t:none,t:urlDecodeUni,\
  setvar:tx.a10_score=+4,\
  msg:'A10:2025 Exceptional Conditions - Integer Overflow Attempt',\
  tag:'OWASP_2025/A10',tag:'INT-OVERFLOW',severity:'MEDIUM'"

# Rule A10-002: Null byte injection
SecRule REQUEST_URI|ARGS|REQUEST_BODY \
  "@rx (?:%00|\\x00|\0)" \
  "id:2010002,phase:2,t:none,t:urlDecodeUni,\
  setvar:tx.a10_score=+5,\
  deny,status:400,\
  msg:'A10:2025 Exceptional Conditions - Null Byte Injection',\
  logdata:'Payload: %{MATCHED_VAR}',\
  tag:'OWASP_2025/A10',tag:'NULL-BYTE',severity:'HIGH'"

# Rule A10-003: Format string attack
SecRule ARGS|REQUEST_BODY \
  "@rx (?:%(?:n|x|s|d|u|f|e|g|c|p|o){2,}|%\d+\$(?:n|s|d))" \
  "id:2010003,phase:2,t:none,t:urlDecodeUni,\
  setvar:tx.a10_score=+6,\
  msg:'A10:2025 Exceptional Conditions - Format String Attack',\
  tag:'OWASP_2025/A10',tag:'FORMAT-STRING',severity:'HIGH'"

# Rule A10-004: Buffer overflow / overly large input
SecRule REQUEST_BODY \
  "@gt 1048576" \
  "id:2010004,phase:2,t:none,\
  deny,status:413,\
  msg:'A10:2025 Exceptional Conditions - Oversized Request Body',\
  tag:'OWASP_2025/A10',tag:'BUFFER-OVERFLOW',severity:'MEDIUM'"

# Rule A10-005: ReDoS — Regular Expression Denial of Service
SecRule ARGS|REQUEST_BODY \
  "@rx (?:(?:a+)+$|(?:(?:aa)+)+$|\([^)]*\){10,}|(?:\w+\s*){20,})" \
  "id:2010005,phase:2,t:none,\
  setvar:tx.a10_score=+4,\
  msg:'A10:2025 Exceptional Conditions - ReDoS Pattern Detected',\
  tag:'OWASP_2025/A10',tag:'ReDoS',severity:'MEDIUM'"

# Evaluasi A10 score
SecRule TX:a10_score "@ge 5" \
  "id:2010099,phase:2,t:none,deny,status:400,\
  msg:'A10:2025 Mishandling of Exceptional Conditions - Score Exceeded',\
  logdata:'A10 Score: %{tx.a10_score}',\
  tag:'OWASP_2025/A10',severity:'HIGH'"


# =============================================================================
# GABUNGAN — Final Anomaly Score Evaluation (semua kategori)
# =============================================================================

# Propagasi semua score ke anomaly_score utama
SecAction \
  "id:2099001,phase:2,nolog,pass,\
  setvar:tx.anomaly_score=+%{tx.a01_score},\
  setvar:tx.anomaly_score=+%{tx.a02_score},\
  setvar:tx.anomaly_score=+%{tx.a04_score},\
  setvar:tx.anomaly_score=+%{tx.a05_score},\
  setvar:tx.anomaly_score=+%{tx.a07_score},\
  setvar:tx.anomaly_score=+%{tx.a08_score},\
  setvar:tx.anomaly_score=+%{tx.a10_score}"

# Final blocking decision
SecRule TX:anomaly_score "@ge %{tx.inbound_anomaly_score_threshold}" \
  "id:2099099,phase:2,t:none,deny,status:403,log,\
  msg:'OWASP Top 10:2025 - Final Block: Anomaly Threshold Exceeded',\
  logdata:'Total score: %{tx.anomaly_score} | A01:%{tx.a01_score} A02:%{tx.a02_score} A04:%{tx.a04_score} A05:%{tx.a05_score} A07:%{tx.a07_score} A08:%{tx.a08_score} A10:%{tx.a10_score} | URI:%{REQUEST_URI} | IP:%{REMOTE_ADDR}',\
  tag:'OWASP_2025/BLOCK',severity:'CRITICAL'"
