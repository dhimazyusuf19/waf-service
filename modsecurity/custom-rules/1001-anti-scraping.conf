# ─────────────────────────────────────────────────────────────────────────────
# Custom Rule: Anti Web Scraping
# File: /etc/nginx/modsecurity/custom-rules/1001-anti-scraping.conf
# Sesuai Proposal TA — Fase 3: Anti-Scraping berbasis header HTTP Referer
# dan rule ModSecurity (tanpa ML/CAPTCHA sesuai batasan penelitian)
#
# Teknik deteksi:
#   1. User-Agent bot yang dikenal
#   2. User-Agent kosong
#   3. Pola request otomatis (no Accept-Language, no Accept-Encoding)
#   4. Kombinasi header yang tidak wajar (fingerprint bot)
#   5. Scraping framework signature
# ─────────────────────────────────────────────────────────────────────────────

# ─── Inisialisasi scraping score ─────────────────────────────────────────────
SecAction \
    "id:1001000,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.scraping_score=0"

# ─── Rule 1001001: User-Agent bot terkenal ───────────────────────────────────
# Daftar lengkap scraping tools & libraries
SecRule REQUEST_HEADERS:User-Agent \
    "@rx (?i)(scrapy|python-requests|python-urllib|urllib3|httpx|aiohttp|requests|mechanize|beautifulsoup|lxml|selenium|playwright|puppeteer|phantomjs|splash|headless|wget|curl|libcurl|libwww-perl|lwp-|jakarta|java/[0-9]|okhttp|volley|axios|node-fetch|got/|superagent|restsharp|htmlunit|guzzle|go-http|fasthttp|dart:|cfnetwork|dataprovider|semrush|ahrefsbot|mj12bot|dotbot|rogerbot|exabot|serpstatbot|bytespider)" \
    "id:1001001,\
    phase:1,\
    t:none,\
    deny,\
    status:403,\
    msg:'Anti-Scraping: Known scraping/bot User-Agent detected',\
    logdata:'User-Agent: %{REQUEST_HEADERS.User-Agent} | IP: %{REMOTE_ADDR}',\
    tag:'ANTI-SCRAPING',\
    severity:'WARNING'"

# ─── Rule 1001002: User-Agent kosong ─────────────────────────────────────────
SecRule &REQUEST_HEADERS:User-Agent "@eq 0" \
    "id:1001002,\
    phase:1,\
    t:none,\
    deny,\
    status:403,\
    msg:'Anti-Scraping: Empty User-Agent header',\
    logdata:'IP: %{REMOTE_ADDR} | URI: %{REQUEST_URI}',\
    tag:'ANTI-SCRAPING',\
    severity:'WARNING'"

# ─── Rule 1001003: Tidak ada Accept-Language (fingerprint bot) ───────────────
# Browser normal selalu mengirim Accept-Language
SecRule &REQUEST_HEADERS:Accept-Language "@eq 0" \
    "id:1001003,\
    phase:1,\
    t:none,\
    setvar:tx.scraping_score=+2,\
    msg:'Anti-Scraping: Missing Accept-Language header (bot fingerprint)',\
    tag:'ANTI-SCRAPING'"

# ─── Rule 1001004: Tidak ada Accept header ───────────────────────────────────
SecRule &REQUEST_HEADERS:Accept "@eq 0" \
    "id:1001004,\
    phase:1,\
    t:none,\
    setvar:tx.scraping_score=+2,\
    msg:'Anti-Scraping: Missing Accept header',\
    tag:'ANTI-SCRAPING'"

# ─── Rule 1001005: Tidak ada Accept-Encoding ─────────────────────────────────
SecRule &REQUEST_HEADERS:Accept-Encoding "@eq 0" \
    "id:1001005,\
    phase:1,\
    t:none,\
    setvar:tx.scraping_score=+1,\
    msg:'Anti-Scraping: Missing Accept-Encoding header',\
    tag:'ANTI-SCRAPING'"

# ─── Rule 1001006: User-Agent terlalu pendek (< 10 karakter) ─────────────────
SecRule REQUEST_HEADERS:User-Agent "@rx ^.{1,9}$" \
    "id:1001006,\
    phase:1,\
    t:none,\
    setvar:tx.scraping_score=+3,\
    msg:'Anti-Scraping: Suspiciously short User-Agent',\
    logdata:'User-Agent: %{REQUEST_HEADERS.User-Agent}',\
    tag:'ANTI-SCRAPING'"

# ─── Rule 1001007: Scrapy signature (multi-header detection) ─────────────────
# Scrapy mengirim: User-Agent, Host, Accept, Accept-Encoding saja
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)scrapy" \
    "id:1001007,\
    phase:1,\
    t:none,\
    deny,\
    status:403,\
    msg:'Anti-Scraping: Scrapy framework detected',\
    tag:'ANTI-SCRAPING',\
    severity:'CRITICAL'"

# ─── Rule 1001008: Evaluasi total scraping score ─────────────────────────────
SecRule TX:scraping_score "@ge 4" \
    "id:1001008,\
    phase:1,\
    t:none,\
    deny,\
    status:403,\
    msg:'Anti-Scraping: Bot fingerprint score exceeded threshold',\
    logdata:'Scraping score: %{tx.scraping_score} | UA: %{REQUEST_HEADERS.User-Agent} | IP: %{REMOTE_ADDR}',\
    tag:'ANTI-SCRAPING',\
    severity:'WARNING'"

# ─── Rule 1001009: Blokir request ke /robots.txt dengan user agent mencurigakan
SecRule REQUEST_URI "@streq /robots.txt" \
    "id:1001009,\
    phase:1,\
    t:none,\
    chain,\
    msg:'Anti-Scraping: Suspicious robots.txt access'"
    SecRule REQUEST_HEADERS:User-Agent \
        "@rx (?i)(bot|spider|crawl|scrape|index|harvest)" \
        "setvar:tx.scraping_score=+3"

# ─── Rule 1001010: Deteksi pola request berulang (same URI, burst) ───────────
# Ini dikombinasikan dengan rate limiting Nginx
SecRule REQUEST_URI "@rx /api/(products|data|list|search|catalog)" \
    "id:1001010,\
    phase:1,\
    t:none,\
    chain,\
    msg:'Anti-Scraping: Suspicious repeated access to data endpoints'"
    SecRule &REQUEST_HEADERS:Cookie "@eq 0" \
        "setvar:tx.scraping_score=+2,\
        logdata:'No cookie on data endpoint: %{REQUEST_URI}'"
