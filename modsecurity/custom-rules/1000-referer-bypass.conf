# ─────────────────────────────────────────────────────────────────────────────
# Custom Rule: HTTP Referer Bypass Detection
# File: /etc/nginx/modsecurity/custom-rules/1000-referer-bypass.conf
# Sesuai Proposal TA — Fase 3 Development: Mekanisme Validasi HTTP Referer
#
# Teknik bypass yang dideteksi:
#   1. Referer header kosong pada endpoint sensitif
#   2. Referer yang tidak cocok dengan domain sendiri
#   3. Manipulasi via X-Forwarded-Host / X-Original-URL
#   4. Double encoding pada Referer
#   5. Referer spoofing dengan unicode/null byte
# ─────────────────────────────────────────────────────────────────────────────

# ─── Rule 1000: Inisialisasi variabel referer ─────────────────────────────────
SecAction \
    "id:1000000,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.referer_bypass_score=0,\
    setvar:tx.allowed_domains='app1.local|app2.local|app3.local|waf.local'"

# ─── Rule 1001: Deteksi Referer kosong pada endpoint /api/ ───────────────────
# Permintaan ke /api/* wajib memiliki Referer dari domain sendiri
SecRule REQUEST_URI "@beginsWith /api/" \
    "id:1000001,\
    phase:1,\
    t:none,\
    chain,\
    msg:'HTTP Referer Bypass: Empty Referer on API endpoint',\
    logdata:'URI: %{REQUEST_URI} | IP: %{REMOTE_ADDR}',\
    tag:'REFERER-BYPASS',\
    tag:'OWASP_CRS',\
    severity:'WARNING'"
    SecRule &REQUEST_HEADERS:Referer "@eq 0" \
        "setvar:tx.referer_bypass_score=+3"

# ─── Rule 1002: Referer tidak cocok domain sendiri ───────────────────────────
SecRule REQUEST_HEADERS:Referer "@rx ^https?://" \
    "id:1000002,\
    phase:1,\
    t:none,\
    chain,\
    msg:'HTTP Referer Bypass: Referer from unauthorized domain',\
    logdata:'Referer: %{REQUEST_HEADERS.Referer} | URI: %{REQUEST_URI}',\
    tag:'REFERER-BYPASS'"
    SecRule REQUEST_HEADERS:Referer \
        "!@rx ^https?://(www\.)?(app1\.local|app2\.local|app3\.local|waf\.local|localhost)" \
        "setvar:tx.referer_bypass_score=+5"

# ─── Rule 1003: X-Forwarded-Host manipulation ────────────────────────────────
# Teknik bypass: attacker set X-Forwarded-Host ke domain sendiri
SecRule REQUEST_HEADERS:X-Forwarded-Host \
    "!@rx ^(app1\.local|app2\.local|app3\.local|waf\.local|localhost)$" \
    "id:1000003,\
    phase:1,\
    t:none,\
    chain,\
    msg:'HTTP Referer Bypass: X-Forwarded-Host manipulation',\
    logdata:'X-Forwarded-Host: %{REQUEST_HEADERS.X-Forwarded-Host}',\
    tag:'REFERER-BYPASS'"
    SecRule &REQUEST_HEADERS:X-Forwarded-Host "@gt 0" \
        "setvar:tx.referer_bypass_score=+7"

# ─── Rule 1004: X-Original-URL bypass ───────────────────────────────────────
SecRule REQUEST_HEADERS:X-Original-URL "@rx .+" \
    "id:1000004,\
    phase:1,\
    t:none,\
    deny,\
    status:403,\
    msg:'HTTP Referer Bypass: X-Original-URL header not allowed',\
    logdata:'X-Original-URL: %{REQUEST_HEADERS.X-Original-URL}',\
    tag:'REFERER-BYPASS',\
    severity:'CRITICAL'"

# ─── Rule 1005: X-Rewrite-URL bypass ────────────────────────────────────────
SecRule REQUEST_HEADERS:X-Rewrite-URL "@rx .+" \
    "id:1000005,\
    phase:1,\
    t:none,\
    deny,\
    status:403,\
    msg:'HTTP Referer Bypass: X-Rewrite-URL header not allowed',\
    tag:'REFERER-BYPASS',\
    severity:'CRITICAL'"

# ─── Rule 1006: Double encoding pada Referer ─────────────────────────────────
SecRule REQUEST_HEADERS:Referer "@rx %25[0-9a-fA-F]{2}" \
    "id:1000006,\
    phase:1,\
    t:none,\
    setvar:tx.referer_bypass_score=+5,\
    msg:'HTTP Referer Bypass: Double URL encoding in Referer',\
    tag:'REFERER-BYPASS'"

# ─── Rule 1007: Null byte dalam Referer ──────────────────────────────────────
SecRule REQUEST_HEADERS:Referer "@rx (\x00|%00)" \
    "id:1000007,\
    phase:1,\
    t:none,\
    deny,\
    status:400,\
    msg:'HTTP Referer Bypass: Null byte in Referer header',\
    tag:'REFERER-BYPASS',\
    severity:'CRITICAL'"

# ─── Rule 1008: Evaluasi total score referer bypass ──────────────────────────
SecRule TX:referer_bypass_score "@ge 5" \
    "id:1000008,\
    phase:1,\
    t:none,\
    deny,\
    status:403,\
    msg:'HTTP Referer Bypass Detected — Score exceeded threshold',\
    logdata:'Referer bypass score: %{tx.referer_bypass_score} | URI: %{REQUEST_URI} | Referer: %{REQUEST_HEADERS.Referer}',\
    tag:'REFERER-BYPASS',\
    severity:'CRITICAL'"
